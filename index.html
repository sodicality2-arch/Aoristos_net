<!DOCTYPE html>
<html lang="ja" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aoristos | 大阪星光学院 自学団体</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Noto+Sans+JP:wght@300;400;500;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <!-- KaTeX for Math -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="./style.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans JP"', 'sans-serif'],
                        serif: ['"Cinzel"', 'serif'],
                        mono: ['"Fira Code"', 'monospace'],
                    },
                    colors: {
                        aoristos: {
                            dark: '#0f172a',
                            light: '#f8fafc',
                            primary: '#0ea5e9',
                            secondary: '#10b981',
                            accent: '#6366f1',
                            muted: '#94a3b8'
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.8s ease-out forwards',
                        'slide-up': 'slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'blob': 'blob 7s infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(40px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        }
                    }
                }
            }
        }
    </script>

    </head>
<body class="antialiased selection:bg-aoristos-primary selection:text-white relative">

    <!-- Ambient Background -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-[-1]">
        <div class="bg-shape bg-blue-200 dark:bg-blue-900 w-96 h-96 rounded-full top-[-10%] left-[-10%] animate-blob"></div>
        <div class="bg-shape bg-emerald-200 dark:bg-emerald-900 w-96 h-96 rounded-full bottom-[-10%] right-[-10%] animate-blob" style="animation-delay: 2s;"></div>
        <div class="bg-shape bg-indigo-200 dark:bg-indigo-900 w-96 h-96 rounded-full top-[40%] left-[50%] animate-blob" style="animation-delay: 4s;"></div>
    </div>

    <!-- Global Navigation -->
    <header class="fixed top-0 left-0 w-full z-50 glass border-b-0 shadow-sm transition-all duration-300" id="global-header">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <a href="#/" class="flex items-center gap-2 font-serif text-2xl font-bold tracking-widest hover:text-aoristos-primary transition-colors">
                <i class="ph ph-infinity text-3xl text-aoristos-primary"></i>
                <span id="brand-text">Aoristos</span>
            </a>
            
            <div class="flex items-center gap-6">
                <nav id="nav-links" class="hidden md:flex gap-6 text-sm font-medium tracking-wide"></nav>

                <div class="flex items-center gap-3 border-l border-gray-300 dark:border-gray-700 pl-4">
                    <button id="search-btn" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-800 transition-colors" aria-label="Search">
                        <i class="ph ph-magnifying-glass text-xl"></i>
                    </button>
                    <button id="theme-toggle" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-800 transition-colors" aria-label="Toggle Theme">
                        <i class="ph ph-moon text-xl dark:hidden"></i>
                        <i class="ph ph-sun text-xl hidden dark:block text-yellow-400"></i>
                    </button>
                    <!-- Mobile Menu Button -->
                    <button id="mobile-menu-btn" class="md:hidden p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-800 transition-colors">
                        <i class="ph ph-list text-2xl"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Mobile Menu Overlay -->
    <div id="mobile-menu" class="fixed inset-0 bg-white/95 dark:bg-slate-900/95 backdrop-blur-lg z-40 transform translate-x-full transition-transform duration-300 flex flex-col items-center justify-center gap-8 text-2xl font-serif">
        <button id="mobile-close-btn" class="absolute top-6 right-6 p-2 text-gray-500 hover:text-gray-900 dark:hover:text-white">
            <i class="ph ph-x text-3xl"></i>
        </button>
        <nav id="mobile-links" class="flex flex-col gap-6 text-2xl font-serif items-center"></nav>
    </div>

    <!-- Search Modal -->
    <div id="search-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[60] opacity-0 pointer-events-none transition-opacity duration-300 flex items-start justify-center pt-24 px-4">
        <div class="bg-white dark:bg-slate-800 w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden transform -translate-y-8 transition-transform duration-300" id="search-container">
            <div class="p-4 border-b border-gray-100 dark:border-gray-700 flex items-center gap-3">
                <i class="ph ph-magnifying-glass text-xl text-gray-400"></i>
                <input type="text" id="search-input" class="w-full bg-transparent border-none outline-none text-lg text-gray-900 dark:text-white placeholder-gray-400" placeholder="記事を検索...">
                <button id="search-close" class="p-1 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200"><i class="ph ph-x text-xl"></i></button>
            </div>
            <div id="search-results" class="max-h-[60vh] overflow-y-auto p-2">
                <!-- Search results will be injected here -->
                <div class="text-center py-8 text-gray-500 text-sm">検索キーワードを入力してください</div>
            </div>
        </div>
    </div>

    <!-- SPA Root Mount Point -->
    <main id="app-container" class="min-h-screen pt-16 flex flex-col">
        <!-- Views will be dynamically injected here -->
        <div class="flex-grow flex items-center justify-center">
            <div class="spinner"></div>
        </div>
    </main>

    <!-- Global Footer -->
    <footer class="border-t border-gray-200 dark:border-gray-800 bg-white/50 dark:bg-slate-900/50 backdrop-blur-md mt-auto">
        <div class="max-w-7xl mx-auto px-6 py-12">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-8">
                <div class="col-span-1 md:col-span-2">
                    <a href="#/" class="flex items-center gap-2 font-serif text-2xl font-bold tracking-widest mb-4">
                        <i class="ph ph-infinity text-aoristos-primary"></i> Aoristos
                    </a>
                    <p id="footer-description" class="text-sm text-gray-600 dark:text-gray-400 max-w-md leading-relaxed"></p>
                </div>
                <div>
                    <h4 class="font-bold mb-4 font-serif">Explore</h4>
                    <ul id="footer-explore-links" class="space-y-2 text-sm text-gray-600 dark:text-gray-400"></ul>
                </div>
                <div>
                    <h4 class="font-bold mb-4 font-serif">Connect</h4>
                    <div id="footer-connect-links" class="flex gap-4"></div>
                </div>
            </div>
            <div id="footer-copyright" class="mt-12 pt-8 border-t border-gray-200 dark:border-gray-800 text-center text-sm text-gray-500"></div>
        </div>
    </footer>

    <!-- External Scripts -->
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
    <script defer src="./app.js"></script>
</body>
</html>
